// markdown-core is compiled without the Compose compiler, so its types carry no stability metadata.
// Its model and dialect types are deeply immutable, and the lists they hold are never mutated after a
// snapshot is published, so the renderer treats them as stable and skips blocks whose nodes are equal.
com.adamglin.compose.markdown.core.model.**
com.adamglin.compose.markdown.core.dialect.**
kotlin.collections.List
